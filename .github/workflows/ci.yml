name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race -count=1 -coverprofile=cover.out ./...
      - run: go tool cover -func=cover.out | tail -1

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x instalar.sh scripts/release.sh
      - name: syntax
        run: bash -n instalar.sh

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: sentinela:ci
          build-args: VERSION=ci
      - name: Smoke test
        run: |
          docker run --rm sentinela:ci version
          printf 'admin:admin:%s\n' "$(printf 'a-long-test-password' | docker run --rm -i sentinela:ci hash-password 2>/dev/null)" > users.txt
          docker run -d --name s -v "$PWD/users.txt:/users.txt:ro" \
            -e SENTINELA_USERS_FILE=/users.txt -e SENTINELA_METRICS_URL=http://127.0.0.1:1/metrics \
            -p 8080:8080 sentinela:ci
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fs -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/login
          docker logs s
